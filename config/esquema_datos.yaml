# ==============================================================================
# ESQUEMA DE DATOS Y CONTRATO DE CALIDAD
# Centro Nacional de Memoria Histórica (datos.gov.co)
# ==============================================================================

metadatos_sistema:
  - ":id"
  - ":version"
  - ":created_at"
  - ":updated_at"

# ------------------------------------------------------------------------------
# 1. CAMPOS TRANSVERSALES (Compartidos por todos los hechos victimizantes)
# ------------------------------------------------------------------------------
campos_comunes:
  identificadores:
    id_caso:
      nombre_columna: "ID Caso"
      tipo_api: "Number"
      tipo_python: "int"
      requerido: true
      permite_nulos: false
      descripcion: "Identificador numérico único del caso o evento victimizante."

    id_persona:
      nombre_columna: "ID Persona"
      tipo_api: "Number"
      tipo_python: "int"
      requerido: false
      permite_nulos: true
      descripcion: "Identificador numérico de la persona en el registro individual."

  geografia:
    c_digo_dane_de_municipio:
      nombre_columna: "Código DANE de Municipio"
      tipo_api: "Text"
      tipo_python: "string"
      requerido: true
      permite_nulos: false
      descripcion: "Código oficial DANE de 5 dígitos del municipio."

    municipio:
      nombre_columna: "Municipio"
      tipo_api: "Text"
      tipo_python: "string"
      requerido: true
      permite_nulos: false
      descripcion: "Nombre oficial del municipio donde ocurrieron los hechos."

    departamento:
      nombre_columna: "Departamento"
      tipo_api: "Text"
      tipo_python: "string"
      requerido: true
      permite_nulos: false
      descripcion: "Nombre del departamento donde ocurrieron los hechos."

    regi_n:
      nombre_columna: "Región"
      tipo_api: "Text"
      tipo_python: "string"
      requerido: false
      permite_nulos: true
      descripcion: "Subregión geográfica del CNMH (ej. Urabá, Bajo Cauca)."

    latitud_longitud:
      nombre_columna: "latitud-longitud"
      tipo_api: "Point"
      tipo_python: "object"
      requerido: false
      permite_nulos: true
      descripcion: "Coordenadas geográficas espaciales."

  tiempo:
    a_o:
      nombre_columna: "Año"
      tipo_api: "Number"
      tipo_python: "int"
      requerido: true
      permite_nulos: false
      descripcion: "Año de ocurrencia del hecho."

    mes:
      nombre_columna: "Mes"
      tipo_api: "Number"
      tipo_python: "int"
      requerido: false
      permite_nulos: true
      descripcion: "Mes de ocurrencia (1-12 o 0 sin información)."

    d_a:
      nombre_columna: "Día"
      tipo_api: "Number"
      tipo_python: "int"
      requerido: false
      permite_nulos: true
      descripcion: "Día de ocurrencia (1-31 o 0 sin información)."

  caracterizacion_persona:
    sexo:
      nombre_columna: "Sexo"
      tipo_api: "Text"
      tipo_python: "string"
      requerido: false
      permite_nulos: true
      descripcion: "Sexo biológico o de identidad de la persona."

    etnia:
      nombre_columna: "Etnia"
      tipo_api: "Text"
      tipo_python: "string"
      requerido: false
      permite_nulos: true
      descripcion: "Pertenencia étnica autorreconocida (Indígena, Afro, etc.)."

    ocupaci_n:
      nombre_columna: "Ocupación"
      tipo_api: "Text"
      tipo_python: "string"
      requerido: false
      permite_nulos: true
      descripcion: "Ocupación o actividad comunitaria de la víctima."

    edad:
      nombre_columna: "Edad"
      tipo_api: "Text"
      tipo_python: "string"
      requerido: false
      permite_nulos: true
      descripcion: "Edad registrada al momento del hecho victimizante."

