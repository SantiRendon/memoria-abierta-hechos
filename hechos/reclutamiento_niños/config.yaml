# Configuración específica para el hecho: Reclutamiento de Niños y Niñas
hecho:
  id: "reclutamiento_niños"
  nombre: "Reclutamiento y Utilización de Niños, Niñas y Adolescentes"
  descripcion: "Vinculación forzada o coaccionada de menores de 18 años a grupos armados"

archivos:
