  victimas_raw: "data/raw/victimas_reclutamiento_raw.csv"
  procesado: "data/processed/reclutamiento_unificado.csv"
  features: "data/features/features_reclutamiento.csv"
  modelo: "modelos/modelo_reclutamiento_riesgo.joblib"

parametros_features:
  ventana_lag_anios: [1, 2, 3]
  umbral_alto_riesgo_victimas: 3

